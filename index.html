<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Peta Overlay Realisasi Penanaman</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <style>
      html, body {
        margin: 0;
        height: 100%;
        width: 100%;
        font-family: Arial, sans-serif;
      }

      #map {
        width: 100%;
        height: 100%;
      }

      .leaflet-container {
        background: #dfeaf4;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script>
      const bounds = [[-0.1584167273571588, 110.39300311236715], [-0.1384996626720796, 110.41652450117508]];

      const map = L.map('map', {
        zoomControl: true,
        maxZoom: 28,
        minZoom: 1
      }).fitBounds(bounds);

      const osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors'
      }).addTo(map);

      const data = {
        type: 'FeatureCollection',
        features: [
          {
            type: 'Feature',
            properties: {
              name: 'Area A',
              luas_ha: '12.4',
              blok: 'A-01'
            },
            geometry: {
              type: 'Polygon',
              coordinates: [[
                [110.3945, -0.1548],
                [110.4012, -0.1548],
                [110.4012, -0.1476],
                [110.3945, -0.1476],
                [110.3945, -0.1548]
              ]]
            }
          },
          {
            type: 'Feature',
            properties: {
              name: 'Area B',
              luas_ha: '18.7',
              blok: 'B-02'
            },
            geometry: {
              type: 'Polygon',
              coordinates: [[
                [110.4068, -0.1522],
                [110.4144, -0.1522],
                [110.4144, -0.1431],
                [110.4068, -0.1431],
                [110.4068, -0.1522]
              ]]
            }
          }
        ]
      };

      const polygonStyle = {
        color: '#e31a1c',
        weight: 2,
        opacity: 1,
        fillColor: '#fcbba1',
        fillOpacity: 0.6
      };

      L.geoJSON(data, {
        style: polygonStyle,
        onEachFeature: function (feature, layer) {
          const props = feature.properties || {};
          const html = `
            <div>
              <strong>${props.name || 'Area'}</strong><br>
              Blok: ${props.blok || '-'}<br>
              Luas (ha): ${props.luas_ha || '-'}
            </div>
          `;
          layer.bindPopup(html);
        }
      }).addTo(map);

      L.control.scale({ position: 'bottomleft' }).addTo(map);
    </script>
  </body>
</html>
